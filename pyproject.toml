[project]
name = "deal-desk-agent"
version = "0.1.0"
description = "AI agent that reviews open Salesforce opportunities with explicit guardrails and human review."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.120",
    "fastapi>=0.115",
    "google-cloud-bigquery>=3.27",
    "mcp>=2.3,<3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "requests>=2.32",
    "simple-salesforce>=1.12.6",
    "uvicorn>=0.32",
]

[project.scripts]
deal-desk = "deal_desk.cli:main"
deal-desk-mcp = "deal_desk.mcp_server:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deal_desk"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # fake tokens in tests

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
