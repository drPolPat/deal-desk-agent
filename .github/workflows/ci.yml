name: ci

on:
  push:
    paths-ignore: ["**.md", "docs/**"]  # docs-only changes don't need evals or a redeploy
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}  # never cancel a deploy halfway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --python 3.12
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -q

  evals:
    # Calls Claude (~$0.15 per run on claude-sonnet-5-5), so only for main and pull requests.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL: claude-sonnet-5-5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --python 3.12
      - name: Require the API key on main
        if: env.ANTHROPIC_API_KEY == '' && github.event_name == 'push'
        run: |
          echo "::error::ANTHROPIC_API_KEY secret is not set; the eval gate cannot run."
          exit 1
      - name: Eval gate (fails below 90% overall or 80% in any category)
        if: env.ANTHROPIC_API_KEY != ''
        run: uv run python evals/run_evals.py --min-pass 0.9 --min-category 0.8
      - name: Upload eval results
        if: always() && env.ANTHROPIC_API_KEY != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: eval-results
          path: evals/results/

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build container image
        run: docker build -t deal-desk-agent:ci .
      - name: Container starts and answers /health
        run: |
          docker run -d --name app -p 8080:8080 -e PORT=8080 deal-desk-agent:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/health && exit 0; sleep 1; done
          docker logs app; exit 1

  deploy:
    # Only after lint, tests, the eval gate and the image build pass, and only once GCP is set up.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
    needs: [evals, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # keyless auth to GCP via Workload Identity Federation
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/deal-desk-agent/app:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3.0.1
      - name: Build and push image
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy to Cloud Run
        # Scale to zero, one instance (runs hold an in-process lock), 15 min for a full run.
        # Secrets come from Secret Manager; nothing secret is stored in GitHub except the eval key.
        run: |
          gcloud run deploy deal-desk-agent --image "$IMAGE" --region "${{ vars.GCP_REGION }}" \
            --service-account "${{ vars.RUNTIME_SA }}" --allow-unauthenticated \
            --min-instances 0 --max-instances 1 --concurrency 10 --timeout 900 --cpu 1 --memory 512Mi \
            --set-secrets "ANTHROPIC_API_KEY=anthropic-api-key:latest,SF_CLIENT_ID=sf-client-id:latest,SF_CLIENT_SECRET=sf-client-secret:latest,REVIEW_API_TOKEN=review-api-token:latest" \
            --set-env-vars "SF_DOMAIN=${{ vars.SF_DOMAIN }},GCP_PROJECT=${{ vars.GCP_PROJECT_ID }},BQ_DATASET=deal_desk,DRY_RUN=${{ vars.DRY_RUN || 'true' }},MODEL=claude-sonnet-5-5,REVIEWER_NAME=${{ vars.REVIEWER_NAME || 'reviewer' }}"
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe deal-desk-agent --region "${{ vars.GCP_REGION }}" --format='value(status.url)')
          # Traffic can take a few seconds to reach the new revision after deploy returns.
          for i in $(seq 1 12); do curl -fsS "$URL/health" && break; [ "$i" = 12 ] && exit 1; sleep 5; done
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/reviews")" = 401
